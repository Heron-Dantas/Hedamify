services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hedamify-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Hedamify_Dev123!"
    ports:
      - "1433:1433"
    volumes:
      - hedamify-sqlserver-data:/var/opt/mssql

volumes:
  hedamify-sqlserver-data:
